<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiencia Interactiva</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
        transition: background 1s ease;
      }
      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }
      .btn-glow {
        box-shadow: 0 0 15px #4caf50;
      }
      .btn-glow:hover {
        box-shadow: 0 0 30px #4caf50;
      }
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .float {
        animation: float 3s ease-in-out infinite;
      }
      #light {
        filter: blur(20px);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-5">
    <div
      id="container"
      class="container p-8 w-full max-w-2xl text-center relative overflow-hidden"
    >
      <div id="lamp" class="text-9xl cursor-pointer float mb-8">💡</div>
      <div
        id="light"
        class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-yellow-200 rounded-full opacity-50"
      ></div>

      <div id="videoContainer" class="hidden mt-8">
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          frameborder="0"
          allow="autoplay; encrypted-media"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <script>
      const lamp = document.getElementById("lamp");
      const light = document.getElementById("light");
      const videoContainer = document.getElementById("videoContainer");
      const container = document.getElementById("container");

      lamp.addEventListener("click", () => {
        gsap.to("body", {
          background: "linear-gradient(120deg, #2C3E50, #000000)",
          duration: 1,
        });
        gsap.to(container, {
          backgroundColor: "rgba(0, 0, 0, 0.5)",
          duration: 1,
        });
        gsap.to(lamp, {
          opacity: 0,
          duration: 0.5,
          onComplete: () => (lamp.style.display = "none"),
        });
        light.style.display = "block";
        gsap.fromTo(
          light,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 0.7, duration: 1, ease: "power2.out" }
        );

        setTimeout(() => {
          gsap.to(light, {
            opacity: 0,
            duration: 0.5,
            onComplete: () => (light.style.display = "none"),
          });

          // Iniciar el video automáticamente
          videoContainer.style.display = "block";
          const iframe = videoContainer.querySelector("iframe");
          iframe.src += "?autoplay=1"; // Agregar el parámetro de autoplay al iframe
        }, 1500);
      });
    </script>
  </body>
</html>
